# Default values for jupyter-control-notebook-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: baltig.infn.it:4567/epics-containers/jupyter-science-epics
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: {}
    

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 0


service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: jupyter.apps.okd-datest.lnf.infn.it
      paths:
        - path: /
          pathType: ImplementationSpecific
          port: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

dataVolume:
  claim: "" ## an existing claim or empty will create a new one
  size: 10Gi ## size of the claim
  accessMode: ReadWriteOnce

gitRepoConfig:
  url:            # if set use git repo for configuration
  branch: main
  path: "."
  exec: "" ## start script (if any) to execute 
## in a python console from jupyter_server.auth import passwd; passwd()
hashedpass: "argon2:$argon2id$v=19$m=10240,t=10,p=8$yZEhXIv+GjgLRKsPbRRCnA$81V1v2J9EQlYdcQ3uKQMzUrfrVQAcYXOOP++op6rtoo"

epicsConfiguration:
  name:    ## load the epicsConfigurationMap
  gateway: ## if defined EPICS_CA_ADDR_LIST is overridden