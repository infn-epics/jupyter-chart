apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jupyter-control-notebook-chart.fullname" . }}
  labels:
    {{- include "jupyter-control-notebook-chart.labels" . | nindent 4 }}
spec:
  serviceName: "jupyter-notebook"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jupyter-control-notebook-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jupyter-control-notebook-chart.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
      - name: fix-permissions
        image: baltig.infn.it:4567/epics-containers/container-init
        command: 
        - sh 
        - -c
        - |
          ls -latr /home/jovyan
          id
          # chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.fsGroup }} /home/jovyan

        volumeMounts:
        - name: jupyter-data
          mountPath: /home/jovyan

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jupyter-control-notebook-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: jupyter-data
              mountPath: /home/jovyan/work
            
          stdin: {{ .Values.image.stdinOpen }}
          tty: {{ .Values.image.tty }}
          {{- if .Values.epicsConfiguration.name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.epicsConfiguration.name }}
          {{- end }}

          env:
          {{- if .Values.epicsConfiguration.gateway }}
            - name: EPICS_CA_ADDR_LIST
              value: {{ .Values.epicsConfiguration.gateway | quote }}
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: "NO"
          {{- end }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          resources:
{{ toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: jupyter-data
          persistentVolumeClaim:
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jupyter-control-notebook-chart.fullname" . }}
  labels:
    {{- include "jupyter-control-notebook-chart.labels" . | nindent 4 }}
spec:
  serviceName: "jupyter-notebook"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jupyter-control-notebook-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jupyter-control-notebook-chart.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
      - name: fix-permissions
        image: baltig.infn.it:4567/epics-containers/container-init
        command: 
        - sh 
        - -c
        - |
          mountdir=/home/jovyan
          cd $mountdir
          id=`id`
          url="{{ .Values.gitRepoConfig.url }}"

          echo "ID: $id git $url"
          if [ -n "$url" ]; then
            clone_dir=$(basename "$url" .git)
            echo "* git directory $clone_dir"
            if [ -d $clone_dir ];then
              cd $clone_dir
              git pull --recurse-submodules
            else 
              if [ -n "{{ .Values.gitRepoConfig.branch }}" ]; then
                git clone -b {{ .Values.gitRepoConfig.branch }} {{ .Values.gitRepoConfig.url }} --recurse-submodules 
              else
                git clone {{ .Values.gitRepoConfig.url }} --recurse-submodules 
              fi
            fi
            
          fi
          ls -latr
        volumeMounts:
        - name: jupyter-data
          mountPath: /tmp

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jupyter-control-notebook-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: jupyter-data
              mountPath: /home/jovyan/work
            
          stdin: {{ .Values.image.stdinOpen }}
          tty: {{ .Values.image.tty }}
          {{- if .Values.epicsConfiguration.name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.epicsConfiguration.name }}
          {{- end }}
          env:
            - name: NOTEBOOK_ARGS
              value: "--PasswordIdentityProvider.hashed_password={{ .Values.hashedpass }}"
            - name: JUPYTER_SERVER_URL
              value: "http://127.0.0.1:8888"
           {{- if .Values.epicsConfiguration.gateway }}
            - name: EPICS_CA_ADDR_LIST
              value: {{ .Values.epicsConfiguration.gateway | quote }}
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: "NO"
            {{- end }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dataVolume.claim }}

      volumes:
        - name: jupyter-data

          persistentVolumeClaim:
            claimName: {{ .Values.dataVolume.claim }}
      
      {{- end }}
  {{- if not .Values.dataVolume.claim }}
  volumeClaimTemplates:
  - metadata:
      name: jupyter-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.dataVolume.size }}
  {{- end }}
