{{- if not .Values.dataVolume.claim }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jupyter-control-notebook-chart.fullname" . }}-jupyter-data
spec:
  accessModes:
    - {{ .Values.dataVolume.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dataVolume.size }}
---
{{- end }}

